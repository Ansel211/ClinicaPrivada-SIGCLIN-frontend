<div class="dashboard-container">
  <nav class="dash-navbar">
    <div class="nav-links">
      <span class="nav-item active">🏠 Inicio</span>
      <span class="nav-item">Citas</span>
      <span class="nav-item">Pacientes</span>
      <span class="nav-item">Médicos</span>
    </div>
    <div class="user-profile">
      <span>{{ nombreUsuario }}</span>
      <button (click)="cerrarSesion()" class="btn btn-sm btn-outline-danger ms-3">Cerrar Sesión</button>
    </div>
  </nav>

  <div class="dash-layout">
    <aside class="sidebar">
      <div class="icon">⚙️</div>
    </aside>

    <main class="main-content">
      <h1 class="dash-title">Dashboard</h1>
      <div class="stats-grid">
        <div class="stat-card">
          <p>Citas Hoy</p>
          <h3>12</h3>
        </div>
        <div class="stat-card">
          <p>Médicos Activos</p>
          <h3>8</h3>
        </div>
        <div class="stat-card">
          <p>Pacientes Atendidos</p>
          <h3>250+</h3>
        </div>
      </div>

      <div class="dashboard-block">
        <h3 class="section-title">Quick Actions</h3>
        <div class="actions-grid">
          <button class="btn-action">Nueva Cita</button>
          <button class="btn-action">Registrar Paciente</button>
        </div>
      </div>

      <h3 class="section-title">Citas Próximas</h3>
      <div class="appointments-list">
        <div class="appointment-item">
          <div class="linea-verde"></div>
          <div>
            <strong>Ana Maria Rodriguez</strong>
            <p style="margin: 0; color: #666; font-size: 0.9rem;">Mama - 10:30 AM</p>
          </div>
          <span>Cardiología</span>
          <span>Mañana, Tarde</span>
        </div>
      </div>
    </main>
  </div>
</div>
