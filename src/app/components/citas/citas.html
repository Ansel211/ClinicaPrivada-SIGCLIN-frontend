<form (submit)="registrarCita($event)">
  <!-- Nombre del Paciente -->
  <div class="mb-3">
    <label class="form-label">Nombre del Paciente</label>
    <input 
      type="text" 
      class="form-control" 
      [(ngModel)]="nuevaCita.nombrePaciente" 
      name="nombrePaciente" 
      (input)="validarFormatoNombre($event)"
      required>
  </div>

  <!-- Desplegable para Asignar Médico -->
   <div class="mb-3">
  <label class="form-label">Asignar Médico</label>
  <select class="form-select" [(ngModel)]="nuevaCita.idMedico" name="idMedico" required>
    <option value="" disabled selected>Seleccione un médico</option>
    @for (medico of medicosDisponibles(); track medico.id) {
      <option [value]="medico.id || medico.idMedico">
        Dr(a). {{ medico.nombre }} - {{ medico.especialidad }}
      </option>
    }
  </select>
</div>
  <!-- Fecha y Hora -->
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Fecha</label>
      <input type="date" class="form-control" [(ngModel)]="nuevaCita.fecha" name="fecha" [min]="fechaMinima" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Hora</label>
      <input type="time" class="form-control" [(ngModel)]="nuevaCita.hora" name="hora" required>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Registrar Cita</button>
</form>
