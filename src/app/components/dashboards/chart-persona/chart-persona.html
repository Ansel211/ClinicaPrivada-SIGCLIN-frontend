<div class="container-fluid py-4">
  <div class="row">
    <!-- Gráfico 1: Usuarios por Rol (Donut) -->
    <div class="col-md-6 d-flex justify-content-center">
      <div class="chart-wrapper w-100 p-3 bg-white rounded shadow-sm">
        <apx-chart
          [title]="chartOptionsDonut.title!"
          [series]="chartOptionsDonut.series!"
          [chart]="chartOptionsDonut.chart!"
          [labels]="chartOptionsDonut.labels!"
          [colors]="chartOptionsDonut.colors!"
          [legend]="chartOptionsDonut.legend!">
        </apx-chart>
      </div>
    </div>

    <!-- Gráfico 2: Citas por Médico (Columnas Verticales) -->
    <div class="col-md-6 d-flex justify-content-center">
      <div class="chart-wrapper w-100 p-3 bg-white rounded shadow-sm">
        <app-chart-cita></app-chart-cita>
      </div>
    </div>
  </div>
</div>
