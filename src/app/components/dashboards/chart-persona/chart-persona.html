<div class="container-fluid py-3">

  <!-- 1. Banner de Bienvenida -->
  <div class="card border-0 shadow-sm mb-4 welcome-banner">
    <div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center">
      <div>
        <span class="badge bg-primary-subtle text-primary fw-semibold mb-2 px-3 py-2 rounded-pill">
          <i class="bi bi-shield-check me-1"></i> {{ rolUsuario }}
        </span>
        <h2 class="fw-bold text-dark mb-0">Bienvenido, {{ nombreUsuario }}</h2>
      </div>
      <div class="mt-3 mt-md-0 text-md-end">
        <div class="text-muted small text-uppercase fw-semibold">Fecha del sistema</div>
        <div class="fs-5 fw-bold text-primary">
          <i class="bi bi-calendar3 me-2"></i>{{ fechaActual | date:'dd/MM/yyyy' }}
        </div>
      </div>
    </div>
  </div>

  <!-- 2. Sección de Estadísticas -->
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 class="fw-bold text-dark mb-0">
      <i class="bi bi-bar-chart-line-fill text-primary me-2"></i>Estadísticas y Analítica Clínica
    </h5>
  </div>

  <div class="row g-4">
    <!-- Gráfico 1: Demanda por Especialidad Médica (Radar) -->
    <div class="col-lg-6 d-flex justify-content-center">
      <div class="chart-wrapper w-100 p-3 bg-white rounded shadow-sm">
        <apx-chart
          [title]="chartOptionsRadar.title!"
          [series]="chartOptionsRadar.series!"
          [chart]="chartOptionsRadar.chart!"
          [xaxis]="chartOptionsRadar.xaxis!"
          [yaxis]="chartOptionsRadar.yaxis!"
          [stroke]="chartOptionsRadar.stroke!"
          [fill]="chartOptionsRadar.fill!"
          [markers]="chartOptionsRadar.markers!"
          [colors]="chartOptionsRadar.colors!">
        </apx-chart>
      </div>
    </div>

    <!-- Gráfico 2: Carga de Citas por Médico (Treemap) -->
    <div class="col-lg-6 d-flex justify-content-center">
      <div class="chart-wrapper w-100 p-3 bg-white rounded shadow-sm">
        <apx-chart
          [title]="chartOptionsTreemap.title!"
          [series]="chartOptionsTreemap.series!"
          [chart]="chartOptionsTreemap.chart!"
          [plotOptions]="chartOptionsTreemap.plotOptions!"
          [dataLabels]="chartOptionsTreemap.dataLabels!"
          [colors]="chartOptionsTreemap.colors!">
        </apx-chart>
      </div>
    </div>

    <!-- Gráfico 3: Tendencia de Citas por Fecha (Área a ancho completo) -->
    <div class="col-12 d-flex justify-content-center">
      <div class="chart-wrapper w-100 p-3 bg-white rounded shadow-sm">
        <apx-chart
          [title]="chartOptionsArea.title!"
          [series]="chartOptionsArea.series!"
          [chart]="chartOptionsArea.chart!"
          [xaxis]="chartOptionsArea.xaxis!"
          [stroke]="chartOptionsArea.stroke!"
          [dataLabels]="chartOptionsArea.dataLabels!"
          [colors]="chartOptionsArea.colors!">
        </apx-chart>
      </div>
    </div>
  </div>

</div>
