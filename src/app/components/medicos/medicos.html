<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>Lista de Médicos</h4>
    <button class="btn btn-outline-primary btn-sm" (click)="obtenerMedicos()">
      <i class="bi bi-arrow-clockwise"></i> Actualizar
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Nombre Completo</th>
              <th>Especialidad</th>
              <th>Disponibilidad</th>
            </tr>
          </thead>
          <tbody>
            <!-- Iteración sobre la lista de médicos -->
            <tr *ngFor="let m of listaMedicos(); let i = index">
              <td>{{ m.id }}</td>
              <td class="fw-bold">{{ m.nombre }}</td>
              <td>
                <span class="badge bg-info text-dark">{{ m.especialidad }}</span>
              </td>
              <td>
                <span class="badge" [ngClass]="m.disponibilidad === 'disponibles' || m.disponibilidad === 'disponible' ? 'bg-success' : 'bg-danger'">
                  {{ m.disponibilidad }}
                </span>
              </td>
            </tr>

            <!-- Mensaje si la lista está vacía -->
            <tr *ngIf="listaMedicos().length === 0">
              <td colspan="4" class="text-center py-4 text-muted">
                No hay médicos registrados en el sistema.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
